name: Tests

# Runs the main app's test suite (tests/, see pytest.ini) and the voice
# satellite's own suite (satellite/tests/) on every PR and on every push to
# main. The satellite is a separate deployable with its own requirements;
# its tests use fakes for the mic/speaker, so they need no audio hardware
# or wake-word model.

on:
  push:
    branches: [main]
  pull_request:

# 6.59: the repo is public; tests only read it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  satellite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: satellite/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests
