name: Tests

# Runs the main app's test suite (tests/, see pytest.ini) on every PR and on
# every push to main -- previously nothing ran it automatically, so
# correctness depended entirely on whoever was working the repo remembering
# to run `pytest` by hand before merging.
#
# Scoped the same way pytest.ini already is: satellite/ is a separate
# deployable with its own hardware-adjacent requirements-test.txt and isn't
# run here (see pytest.ini's own comment for why).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
