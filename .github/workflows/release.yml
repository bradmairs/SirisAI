name: Release

# Tags and releases each new version as it reaches main. The version lives
# in app/__init__.py and is bumped with scripts/bump_version.py in the same
# PR as the change (see CLAUDE.md). A push to main whose version already
# has a tag does nothing; one with a new version gets the tag v<version>
# and a GitHub release whose notes are that version's CHANGELOG.md section.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"([0-9.]+)\"', open('app/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - if: steps.version.outputs.new == 'true'
        name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "SirisAI ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
