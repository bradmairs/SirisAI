<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Siris Mind Map</title>
<link rel="stylesheet" href="/siris-glass.css">
<style>
  html, body { height: 100%; margin: 0; color: var(--ink-2); font: 14px/1.5 var(--font); }
  main { height: 100%; display: grid; place-items: center; text-align: center; padding: 0 16px; }
  #status { margin: 0; padding: 16px 22px; max-width: 34rem; border-radius: var(--r-lg); }
  b { color: var(--brain); font-weight: 600; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"><div class="wallpaper__blob"></div><div class="wallpaper__blob"></div><div class="wallpaper__blob"></div><div class="wallpaper__blob"></div><div class="wallpaper__grain"></div></div>
<main><p id="status" class="glass">Loading the brain…</p></main>
<script>
  // The map embeds every note, so it's fetched with the API key rather than served openly.
  // Open once as /brain?key=YOUR_API_KEY to store the key in this browser (same as /hud).
  const params = new URLSearchParams(location.search);
  if (params.get("key")) localStorage.setItem("sirisai_api_key", params.get("key"));
  const key = localStorage.getItem("sirisai_api_key") || "";
  fetch("/siris/brain/map.html", { headers: key ? { Authorization: `Bearer ${key}` } : {} })
    .then(async (r) => {
      if (r.status === 401) throw new Error("Unauthorized: open this page once as <b>/brain?key=YOUR_API_KEY</b>.");
      if (r.status === 404) throw new Error("Siris isn't set up. Set <b>SIRISAI_BRAIN_PATH</b> and restart.");
      if (!r.ok) throw new Error(`The map couldn't be drawn (${r.status}).`);
      const html = await r.text();
      document.open(); document.write(html); document.close();
    })
    .catch((e) => { document.getElementById("status").innerHTML = e.message; });
</script>
</body>
</html>
