<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>SirisAI HUD</title>
<link rel="stylesheet" href="/siris-glass.css" />
<style>
  /* SirisOS's Liquid Glass tokens (/siris-glass.css) under the HUD's own names. */
  :root {
    --panel: var(--glass-fill);
    --line: var(--hairline);
    --warn: var(--warning);
    --bad: var(--critical);
    --text: var(--ink);
    --muted: var(--ink-3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); font-family: var(--font); overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr; padding: calc(1.2rem + var(--safe-top)) 1.4rem calc(1.2rem + var(--safe-bottom)); gap: 1rem; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 0.6rem; }
  #clock { font-size: clamp(2.6rem, 7vw, 5rem); font-weight: 200; letter-spacing: 0.04em; line-height: 1; }
  #date { color: var(--muted); font-size: 1rem; margin-top: 0.3rem; }
  .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
  .chip { height: 28px; padding: 0 12px; font-size: 0.8rem; color: var(--muted); background: var(--glass-fill); box-shadow: inset 0 0 0 1px var(--line); }
  .chip.on { color: var(--accent-2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-2) 60%, transparent); }
  .chip.warn { color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 60%, transparent); }
  .chip.bad { color: var(--bad); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 60%, transparent); }
  main { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.3fr) minmax(260px, 1.2fr); gap: 1rem; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 1rem; min-height: 0; overflow-y: auto; }
  .panel { padding: 16px 18px; border-radius: var(--r-lg); flex: none; animation: rise 0.6s var(--spring) both; }
  .panel h2 { margin: 0 0 0.6rem; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .rings { display: flex; justify-content: space-around; gap: 0.5rem; }
  .ring { text-align: center; font-size: 0.75rem; color: var(--muted); }
  .ring svg { width: 78px; height: 78px; display: block; margin: 0 auto 0.2rem; }
  .ring .value { font-size: 1rem; fill: var(--text); }
  .big { font-size: 1.8rem; font-weight: 300; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  ul.list { list-style: none; margin: 0; padding: 0; font-size: 0.88rem; }
  ul.list li { padding: 0.35rem 0; border-bottom: 1px solid rgba(96, 200, 255, 0.08); }
  ul.list li:last-child { border-bottom: none; }
  ul.list .t { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 0.5rem; }
  .center { align-items: center; justify-content: flex-start; }
  #orb-wrap { position: relative; width: min(340px, 70vw); aspect-ratio: 1; margin-top: 0.5rem; }
  #orb { position: absolute; inset: 14%; border-radius: 50%; border: none; cursor: pointer; background: radial-gradient(circle at 50% 50%, #c9f4ff 0%, #5fd3ff 18%, #0d3550 55%, #06131d 72%); box-shadow: 0 0 40px rgba(95, 211, 255, 0.45), inset 0 0 30px rgba(95, 211, 255, 0.5); transition: transform 0.2s ease, box-shadow 0.2s ease; }
  #orb:active { transform: scale(0.97); }
  #orb.listening { box-shadow: 0 0 70px rgba(138, 245, 200, 0.75), inset 0 0 40px rgba(138, 245, 200, 0.7); }
  #orb.speaking { animation: pulse 1.2s ease-in-out infinite; }
  #orb.thinking { animation: spin 2.4s linear infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 90px rgba(95, 211, 255, 0.85), inset 0 0 50px rgba(95, 211, 255, 0.9); } }
  @keyframes spin { to { filter: hue-rotate(360deg); } }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #orb-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
  #wake-toggle { display: block; margin: 0.6rem auto 0; cursor: pointer; }
  #transcript { min-height: 1.4em; text-align: center; color: var(--accent-2); margin-top: 0.8rem; font-size: 1rem; }
  #reply { text-align: center; font-size: 1.05rem; line-height: 1.45; max-width: 36rem; margin-top: 0.4rem; }
  .cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; }
  .cam { position: relative; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 10; background: #000; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam span { position: absolute; left: 0.4rem; bottom: 0.3rem; font-size: 0.7rem; color: #fff; text-shadow: 0 1px 3px #000; text-transform: capitalize; }
  #error { position: fixed; bottom: 0.8rem; left: 50%; transform: translateX(-50%); color: var(--bad); font-size: 0.85rem; }
  @media (max-width: 900px) {
    body { overflow-y: auto; height: auto; }
    main { grid-template-columns: 1fr; }
    .col { overflow: visible; }
  }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"><div class="wallpaper__blob"></div><div class="wallpaper__blob"></div><div class="wallpaper__blob"></div><div class="wallpaper__blob"></div><div class="wallpaper__grain"></div></div>
<header>
  <div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <section class="col">
    <div class="panel glass">
      <h2>Systems</h2>
      <div class="rings" id="rings"></div>
    </div>
    <div class="panel glass" id="weather-panel" hidden>
      <h2>Outside</h2>
      <div class="big" id="weather-temp"></div>
      <div class="muted" id="weather-text"></div>
    </div>
    <div class="panel glass" id="events-panel" hidden>
      <h2>Coming up</h2>
      <ul class="list" id="events"></ul>
    </div>
    <div class="panel glass" id="car-panel" hidden>
      <h2>Car</h2>
      <div id="car"></div>
    </div>
    <div class="panel glass" id="parcels-panel" hidden>
      <h2>Deliveries</h2>
      <ul class="list" id="parcels"></ul>
    </div>
    <div class="panel glass" id="brain-panel" hidden>
      <h2>Learned today</h2>
      <ul class="list" id="brain"></ul>
    </div>
  </section>

  <section class="col center">
    <div id="orb-wrap">
      <canvas id="wave" width="680" height="680"></canvas>
      <button id="orb" aria-label="Talk to SirisAI"></button>
    </div>
    <div id="orb-hint">Tap to talk</div>
    <button id="wake-toggle" class="chip" type="button" aria-pressed="false">“Hey Siris”: off</button>
    <div id="transcript"></div>
    <div id="reply"></div>
  </section>

  <section class="col">
    <div class="panel glass" id="cams-panel" hidden>
      <h2>Cameras</h2>
      <div class="cams" id="cams"></div>
    </div>
    <div class="panel glass">
      <h2>On my own today</h2>
      <ul class="list" id="autonomy"><li class="muted">Nothing yet.</li></ul>
    </div>
  </section>
</main>
<div id="error"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("key")) localStorage.setItem("sirisai_api_key", params.get("key"));
  const key = () => localStorage.getItem("sirisai_api_key") || "";
  const authHeaders = (extra = {}) => Object.assign(key() ? { Authorization: `Bearer ${key()}` } : {}, extra);
  const $ = (id) => document.getElementById(id);
  const errorBox = $("error");

  async function getJSON(path) {
    const response = await fetch(path, { headers: authHeaders() });
    if (!response.ok) throw new Error(response.status === 401 ? "Unauthorized -- open the HUD as /hud?key=YOUR_API_KEY once" : `${path}: ${response.status}`);
    return response.json();
  }

  // --- clock
  function tick() {
    const now = new Date();
    $("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    $("date").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 1000);

  // --- rings
  function ring(label, percent) {
    const r = 32, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, percent || 0));
    const color = p > 90 ? "var(--bad)" : p > 75 ? "var(--warn)" : "var(--accent)";
    return `<div class="ring"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="${r}" fill="none" stroke="rgba(96,200,255,0.12)" stroke-width="6"/>` +
      `<circle cx="39" cy="39" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" transform="rotate(-90 39 39)"/>` +
      `<text x="39" y="44" text-anchor="middle" class="value">${Math.round(p)}%</text></svg>${label}</div>`;
  }

  function text(node, value) { node.textContent = value; return node; }
  function li(time, body) {
    const item = document.createElement("li");
    if (time) { const t = document.createElement("span"); t.className = "t"; t.textContent = time; item.appendChild(t); }
    item.appendChild(document.createTextNode(body));
    return item;
  }

  async function refresh() {
    try {
      // A tapped HUD can play sound, so it says so and gets notifications to speak (app/notify/routing.py).
      const s = await getJSON("/siris/hud/summary" + (window.sirisHudSpeaker ? "?speaker=1" : ""));
      errorBox.textContent = "";
      if (s.announcements && window.sirisHudAnnounce) window.sirisHudAnnounce(s.announcements);
      if (s.system) {
        const disk = Object.values(s.system.disk || {})[0];
        $("rings").innerHTML = ring("CPU", s.system.cpu_percent) + ring("Memory", s.system.memory.percent_used) + (disk ? ring("Disk", disk.percent_used) : "");
      }
      const chips = [];
      if (s.guest_mode && s.guest_mode.on) chips.push('<span class="chip warn">Guest mode</span>');
      if (s.energy && s.energy.configured) chips.push(`<span class="chip ${s.energy.cheap_now ? "on" : ""}">${s.energy.cheap_now ? "Cheap power now" : "Power: normal rate"}</span>`);
      if (s.car && s.car.low_battery) chips.push(`<span class="chip warn">Car ${Math.round(s.car.battery)}%</span>`);
      chips.push('<span class="chip on">Online</span>');
      $("chips").innerHTML = chips.join("");

      const weatherOk = s.weather && s.weather.temperature_c != null;
      $("weather-panel").hidden = !weatherOk;
      if (weatherOk) { text($("weather-temp"), `${Math.round(s.weather.temperature_c)}°`); text($("weather-text"), s.weather.conditions); }

      const events = s.next_events || [];
      $("events-panel").hidden = !events.length;
      $("events").replaceChildren(...events.map((e) => li(e.start && e.start.includes("T") ? new Date(e.start).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "", e.summary)));

      $("car-panel").hidden = !s.car;
      if (s.car) text($("car"), s.car.summary);

      const parcels = s.parcels || [];
      $("parcels-panel").hidden = !parcels.length;
      $("parcels").replaceChildren(...parcels.map((p) => li("", `${p.label} -- ${p.status_text}`)));

      const brain = s.brain || [];
      $("brain-panel").hidden = !brain.length;
      $("brain").replaceChildren(...brain.map((b) => li(b.action === "learned" ? "new" : "updated", b.title)));

      const autonomy = s.autonomy || [];
      $("autonomy").replaceChildren(...(autonomy.length ? autonomy.map((a) => li(a.local_time, a.what)) : [li("", "Nothing yet.")]));

      setCameras(s.cameras || []);
    } catch (err) {
      errorBox.textContent = err.message;
    }
  }

  // --- cameras: fetched with auth, shown as blob URLs
  let cameraNames = [];
  function setCameras(cameras) {
    const names = cameras.filter((c) => c.enabled !== false).map((c) => c.name).slice(0, 4);
    $("cams-panel").hidden = !names.length;
    if (names.join() === cameraNames.join()) return;
    cameraNames = names;
    $("cams").replaceChildren(...names.map((name) => {
      const tile = document.createElement("div");
      tile.className = "cam";
      tile.innerHTML = `<img alt=""><span></span>`;
      tile.querySelector("span").textContent = name.replace(/_/g, " ");
      tile.dataset.camera = name;
      return tile;
    }));
    refreshCameras();
  }
  async function refreshCameras() {
    for (const tile of document.querySelectorAll(".cam")) {
      try {
        const response = await fetch(`/siris/cameras/${encodeURIComponent(tile.dataset.camera)}/latest.jpg?height=360`, { headers: authHeaders() });
        if (!response.ok) continue;
        const img = tile.querySelector("img");
        const old = img.src;
        img.src = URL.createObjectURL(await response.blob());
        if (old.startsWith("blob:")) URL.revokeObjectURL(old);
      } catch (err) { /* a dead camera keeps its last frame */ }
    }
  }

  refresh();
  setInterval(refresh, 15000);
  setInterval(refreshCameras, 10000);

  // --- voice: tap the orb, speak, tap again (or pause) -- streamed reply plays sentence by sentence
  const orb = $("orb");
  const hint = $("orb-hint");
  const canvas = $("wave");
  const ctx2d = canvas.getContext("2d");
  let recording = null;
  let conversationId = null;

  // iOS Safari only allows HTMLMediaElement.play() when it's called
  // synchronously inside a user-gesture handler, or on an element that was
  // already "unlocked" by such a call earlier -- the reply's play() here
  // happens many seconds later, deep inside the converse() streaming
  // response, which Safari silently blocks (no error, just no sound).
  // Reusing one element that gets unlocked on the orb tap keeps the actual
  // reply playback working.
  const playbackAudio = new Audio();
  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    window.sirisHudSpeaker = true;
    playbackAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    playbackAudio.play().then(() => playbackAudio.pause()).catch(() => {});
  }

  function drawWave(analyser) {
    const data = new Uint8Array(analyser.frequencyBinCount);
    const draw = () => {
      if (!recording) { ctx2d.clearRect(0, 0, canvas.width, canvas.height); return; }
      analyser.getByteTimeDomainData(data);
      ctx2d.clearRect(0, 0, canvas.width, canvas.height);
      ctx2d.strokeStyle = "rgba(138,245,200,0.9)";
      ctx2d.lineWidth = 3;
      ctx2d.beginPath();
      const cx = canvas.width / 2, cy = canvas.height / 2, base = canvas.width * 0.39;
      for (let i = 0; i <= data.length; i++) {
        const v = (data[i % data.length] - 128) / 128;
        const angle = (i / data.length) * Math.PI * 2;
        const radius = base + v * 60;
        const x = cx + Math.cos(angle) * radius, y = cy + Math.sin(angle) * radius;
        if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
      }
      ctx2d.stroke();
      requestAnimationFrame(draw);
    };
    draw();
  }

  function encodeWav(chunks, rate) {
    const length = chunks.reduce((n, c) => n + c.length, 0);
    const view = new DataView(new ArrayBuffer(44 + length * 2));
    const str = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); view.setUint32(4, 36 + length * 2, true); str(8, "WAVE"); str(12, "fmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    str(36, "data"); view.setUint32(40, length * 2, true);
    let o = 44;
    for (const c of chunks) for (const s of c) { view.setInt16(o, Math.max(-1, Math.min(1, s)) * 0x7fff, true); o += 2; }
    return new Blob([view], { type: "audio/wav" });
  }

  // One audio context for the mic, made on the first tap and kept: on iPhone a
  // context created later, without a tap (listening again for an answer), would
  // start suspended and record silence.
  // 6.7: after a reply has played, or a few minutes idle, iPhone leaves the context
  // "interrupted" (or closes it) and the next recording came back empty ("I didn't
  // catch that"). Such a context is replaced here, during the tap.
  let micCtx = null;
  function micContext() {
    if (!micCtx || micCtx.state === "closed" || micCtx.state === "interrupted") {
      if (micCtx) micCtx.close().catch(() => {});
      micCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (micCtx.state !== "running") micCtx.resume().catch(() => {});
    return micCtx;
  }

  // mode: "tap" (the orb), "followUp" (SirisAI asked something; silence gives up quietly), or
  // "wake" (5.8: waiting for "Hey Siris" -- each phrase goes to the server, which drops anything
  // not addressed to SirisAI, so nothing changes on screen until it is).
  async function startRecording(mode = "tap") {
    const followUp = mode === "followUp";
    const wake = mode === "wake";
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    const ctx = micContext();
    if (ctx.state !== "running") await Promise.race([ctx.resume().catch(() => {}), new Promise((r) => setTimeout(r, 1000))]);
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    let silentFor = 0, heard = false, captured = false;
    processor.onaudioprocess = (e) => {
      const samples = new Float32Array(e.inputBuffer.getChannelData(0));
      chunks.push(samples);
      const rms = Math.sqrt(samples.reduce((a, s) => a + s * s, 0) / samples.length);
      if (rms > 0) captured = true;
      if (rms > 0.02) {
        if (!heard && wake && recording) recording.timer = setTimeout(stopRecording, 8000);   // a phrase, not the TV all evening
        heard = true; silentFor = 0;
      } else if (heard) { silentFor += samples.length / ctx.sampleRate; }
      if (heard && silentFor > 1.2) stopRecording();
    };
    source.connect(analyser);
    source.connect(processor);
    processor.connect(ctx.destination);
    recording = { stream, ctx, processor, source, chunks, mode, heard: () => heard, captured: () => captured,
                  timer: wake ? null : setTimeout(stopRecording, followUp ? 8000 : 12000) };
    if (wake) {
      hint.textContent = "Listening for “Hey Siris”";
      return;
    }
    orb.className = "listening";
    hint.textContent = "Listening...";
    drawWave(analyser);
  }

  async function stopRecording(discard = false) {
    if (!recording) return;
    const { stream, ctx, processor, source, chunks, timer, mode, heard, captured } = recording;
    recording = null;
    clearTimeout(timer);
    processor.disconnect(); source.disconnect();
    stream.getTracks().forEach((t) => t.stop());
    if (discard) return;
    if ((mode === "followUp" || mode === "wake") && !heard()) {
      orb.className = "";
      hint.textContent = "Tap to talk";
      resumeWake();
      return;
    }
    if (!captured()) {
      // The microphone gave no sound at all (the audio was asleep): don't send silence; the next tap starts fresh.
      if (micCtx) micCtx.close().catch(() => {});
      micCtx = null;
      orb.className = "";
      hint.textContent = "The microphone didn't pick anything up. Tap to try again";
      resumeWake();
      return;
    }
    converse(encodeWav(chunks, ctx.sampleRate), mode === "wake");
  }

  // Each sentence arrives as its own MP3 clip, but starting every clip
  // separately leaves an audible pause between sentences on iPhone. So
  // whatever has arrived by the time the previous playback ends is joined
  // into one clip -- MP3 frames concatenate cleanly, and the server sends
  // clips without per-file length headers (app/voice/effects.py), which
  // would otherwise make Safari stop after the first one.
  const pendingClips = [];
  const idleWaiters = [];
  let speaking = false;

  function play(base64) {
    pendingClips.push(Uint8Array.from(atob(base64), (c) => c.charCodeAt(0)));
    if (!speaking) playPending();
  }

  function playPending() {
    if (!pendingClips.length) {
      speaking = false;
      idleWaiters.splice(0).forEach((resolve) => resolve());
      return;
    }
    speaking = true;
    orb.className = "speaking";
    const url = URL.createObjectURL(new Blob(pendingClips.splice(0), { type: "audio/mpeg" }));
    let done = false;
    const next = () => {
      if (done) return;
      done = true;
      URL.revokeObjectURL(url);
      playPending();
    };
    playbackAudio.onended = playbackAudio.onerror = next;
    playbackAudio.src = url;
    playbackAudio.play().catch(next);
  }

  // Notifications to say out loud while you're home (5.8). Each is fetched as speech, played
  // through the same queue as replies, then confirmed so it isn't pushed to the phone as well.
  const announced = new Set();
  window.sirisHudAnnounce = async (items) => {
    for (const a of items) {
      if (announced.has(a.id) || (recording && recording.mode !== "wake")) continue;
      announced.add(a.id);
      if (recording) stopRecording(true);   // don't transcribe ourselves
      try {
        const text = a.title && !a.title.startsWith("SirisAI") ? `${a.title}. ${a.message}` : a.message;
        const response = await fetch("/siris/voice/speak", {
          method: "POST", headers: { ...authHeaders(), "Content-Type": "application/json" }, body: JSON.stringify({ text }),
        });
        if (!response.ok) continue;
        const bytes = new Uint8Array(await response.arrayBuffer());
        pendingClips.push(bytes);
        if (!speaking) playPending();
        await speechFinished();
        await fetch(`/siris/hud/announcements/${a.id}/heard`, { method: "POST", headers: authHeaders() });
        $("reply").textContent = a.message;
      } catch (err) { /* not confirmed: SirisAI pushes it to the phone instead */ }
    }
    resumeWake();
  };

  function speechFinished() {
    return speaking ? new Promise((resolve) => idleWaiters.push(resolve)) : Promise.resolve();
  }

  function thinking() {
    orb.className = "thinking";
    hint.textContent = "Thinking...";
    $("transcript").textContent = "";
    $("reply").textContent = "";
  }

  async function converse(wav, wake = false) {
    if (!wake) thinking();
    const form = new FormData();
    form.append("file", wav, "hud.wav");
    if (conversationId) form.append("conversation_id", conversationId);
    if (wake) form.append("wake", "true");
    let expectsReply = false;
    let ignored = false;
    try {
      const response = await fetch("/siris/voice/converse", { method: "POST", body: form, headers: authHeaders() });
      if (!response.ok) throw new Error(`Voice: ${response.status}`);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let newline;
        while ((newline = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, newline).trim();
          buffer = buffer.slice(newline + 1);
          if (!line) continue;
          const event = JSON.parse(line);
          if (event.type === "ignored") ignored = true;
          if (event.type === "transcript" && wake) thinking();
          if (event.type === "transcript") $("transcript").textContent = event.text ? `"${event.text}"` : "";
          if (event.type === "speaker" && event.user_id) hint.textContent = `Hello, ${event.user_id}`;
          if (event.type === "sentence") {
            $("reply").textContent += ($("reply").textContent ? " " : "") + event.text;
            if (event.audio) play(event.audio);
          }
          if (event.type === "final") { conversationId = event.conversation_id || conversationId; expectsReply = !!event.expects_reply; }
          if (event.type === "error") $("reply").textContent = event.detail;
        }
      }
    } catch (err) {
      if (!wake) $("reply").textContent = err.message;
      else ignored = true;
    }
    if (ignored) { resumeWake(); return; }
    await speechFinished();
    orb.className = "";
    hint.textContent = expectsReply ? "Tap to answer" : "Tap to talk";
    refresh();
    if (expectsReply && !recording) {
      startRecording("followUp").catch(() => { hint.textContent = "Tap to answer"; });
    } else {
      resumeWake();
    }
  }

  // "Hey Siris" (5.8): remembered per screen; starting the mic needs a tap after each load.
  const wakeToggle = $("wake-toggle");
  let wakeMode = false;
  try { wakeMode = localStorage.getItem("sirisai_hud_wake") === "1"; } catch (err) { /* private mode */ }
  function showWake() {
    wakeToggle.textContent = `“Hey Siris”: ${wakeMode ? "on" : "off"}`;
    wakeToggle.setAttribute("aria-pressed", String(wakeMode));
    wakeToggle.classList.toggle("on", wakeMode);
    if (wakeMode && !recording && hint.textContent === "Tap to talk") hint.textContent = "Tap once to start listening for “Hey Siris”";
  }
  function resumeWake() {
    if (!wakeMode || recording || !audioUnlocked) return;
    startRecording("wake").catch(() => { hint.textContent = "Tap to talk"; });
  }
  wakeToggle.addEventListener("click", () => {
    unlockAudio();
    micContext();
    wakeMode = !wakeMode;
    try { localStorage.setItem("sirisai_hud_wake", wakeMode ? "1" : "0"); } catch (err) { /* fine */ }
    if (!wakeMode && recording && recording.mode === "wake") { stopRecording(true); hint.textContent = "Tap to talk"; }
    showWake();
    resumeWake();
  });
  showWake();

  orb.addEventListener("click", () => {
    unlockAudio();
    micContext();
    if (recording && recording.mode === "wake") stopRecording(true);   // a tap beats waiting for the wake word
    else if (recording) { stopRecording(); return; }
    startRecording().catch((err) => { hint.textContent = `Microphone unavailable: ${err.message}`; });
  });
})();
</script>
