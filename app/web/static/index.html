<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14161a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SirisAI" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>SirisAI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8b91a0;
    --accent: #5b9dff;
    --user-bubble: #2b3550;
    --assistant-bubble: #22262f;
    --tool-bubble: #24301f;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.4rem 0.75rem;
    padding: 0.75rem 1rem;
    padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 0.25rem; overflow-x: auto; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; white-space: nowrap; }
  @media (max-width: 640px) {
    header { padding-inline: 0.75rem; }
    nav { order: 2; width: 100%; }
    .msg { max-width: 92% !important; }
    #key-bar { flex-wrap: wrap; }
  }
  nav button {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  nav button.active { background: var(--panel); color: var(--text); border-color: var(--border); }

  #key-bar {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  #settings-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    padding: 0.4rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  #settings-bar label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
  #settings-bar input[type="checkbox"] { accent-color: var(--accent); width: 1rem; height: 1rem; }
  #key-bar input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
    width: 16rem;
  }
  #key-bar button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    font-size: 0.8rem;
  }
  #key-status.ok { color: #6fbf73; }
  #key-status.error { color: var(--error); }

  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  /* Each active view fills main's remaining height and scrolls its own
     overflow. Chat additionally needs flex-column (scrolling message list
     + pinned input row) -- plain block flow elsewhere so buttons don't get
     stretched full-width by flex's default align-items: stretch. */
  section.view { display: none; }
  section.view.active { display: block; flex: 1; overflow-y: auto; }
  #chat-view.active { display: flex; flex-direction: column; overflow: hidden; }

  /* Chat */
  #chat-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #new-chat-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.78rem; }
  #new-chat-btn:hover { color: var(--text); }
  #history-select { background: var(--panel); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 0.25rem 0.4rem; font-size: 0.78rem; max-width: 60%; }
  #chat-send-btn.stop { background: #b83a3a; color: #fff; }
  /* Rendered markdown in assistant bubbles */
  .md { white-space: normal; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 0.55rem; white-space: pre-wrap; }
  .md ul, .md ol { margin: 0 0 0.55rem; padding-left: 1.3rem; }
  .md li { margin: 0.15rem 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 0.7rem 0 0.35rem; font-size: 0.98rem; }
  .md code { background: rgba(255,255,255,0.08); padding: 0.05rem 0.3rem; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
  .md pre { background: #14161a; border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.75rem; overflow-x: auto; margin: 0 0 0.55rem; }
  .md pre code { background: none; padding: 0; white-space: pre; font-size: 0.8rem; }
  .md blockquote { margin: 0 0 0.55rem; padding-left: 0.7rem; border-left: 3px solid var(--border); color: var(--muted); }
  .md a { color: var(--accent); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 0.7rem 0; }
  .tag.bad { color: var(--error); border-color: var(--error); }
  .voiceid-hint { color: var(--muted, #888); font-size: 0.85rem; margin: 0.2rem 0 0.6rem; }
  .voiceid-controls { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.6rem; }
  .voiceid-controls input { flex: 1 1 10rem; min-width: 0; }
  .voiceid-entry { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .msg { max-width: 70%; padding: 0.55rem 0.8rem; border-radius: 10px; line-height: 1.4; font-size: 0.92rem; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); }
  .msg.tool { align-self: flex-start; background: var(--tool-bubble); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
  .msg.error { align-self: flex-start; background: #3a2222; color: var(--error); }
  .msg.confirm { align-self: flex-start; background: #3a2f14; border: 1px solid #7a5a1a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
  /* Live turn: what SirisAI is doing while it works (status, reasoning, tool steps) above the answer as it streams in. */
  .msg.live { display: flex; flex-direction: column; gap: 0.45rem; }
  .live-status { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.82rem; }
  .live-spinner { width: 0.75rem; height: 0.75rem; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: live-spin 0.8s linear infinite; flex: none; }
  @keyframes live-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .live-spinner { animation-duration: 3s; } }
  details.thinking { border-left: 2px solid var(--border); padding-left: 0.6rem; color: var(--muted); font-size: 0.82rem; }
  details.thinking summary { cursor: pointer; user-select: none; }
  .thinking-text { white-space: pre-wrap; max-height: 12rem; overflow-y: auto; margin-top: 0.3rem; line-height: 1.35; }
  .tool-steps { display: flex; flex-direction: column; gap: 0.15rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: var(--muted); }
  .tool-step.error { color: var(--error); }
  .confirm-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .confirm-actions button { border: none; border-radius: 6px; padding: 0.25rem 0.7rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
  .confirm-actions .confirm-yes { background: #e0a83a; color: #1a1206; }
  .confirm-actions .confirm-no { background: var(--panel); color: var(--text); border: 1px solid var(--border) !important; }
  .confirm-actions button:disabled { opacity: 0.5; cursor: default; }
  #chat-form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid var(--border); flex-shrink: 0; }
  #chat-form input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.92rem;
  }
  #chat-form button, .action-btn {
    background: var(--accent);
    border: none;
    color: #0b1220;
    font-weight: 600;
    border-radius: 8px;
    padding: 0 1rem;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #chat-form button:disabled { opacity: 0.5; cursor: default; }
  #mic-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 2.6rem;
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
  }
  #attach-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 2.6rem;
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
  }
  #attachments { display: flex; gap: 0.4rem; padding: 0.4rem 1rem 0; flex-wrap: wrap; }
  .attachment { position: relative; }
  .attachment img, .msg img.attached { max-height: 72px; max-width: 120px; border-radius: 6px; border: 1px solid var(--border); display: block; }
  .msg img.attached { max-height: 160px; max-width: 240px; margin-top: 0.3rem; }
  .attachment button { position: absolute; top: -6px; right: -6px; border-radius: 999px; border: none; background: var(--error); color: #1a0d0d; width: 1.2rem; height: 1.2rem; font-size: 0.7rem; cursor: pointer; padding: 0; }
  #mic-btn.recording { background: var(--error); border-color: var(--error); color: #1a0d0d; }
  .speak-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    margin-left: 0.4rem;
    padding: 0;
    vertical-align: middle;
  }
  .speak-btn:disabled { opacity: 0.4; cursor: default; }

  /* Memory */
  #memory-view { padding: 1rem; overflow-y: auto; gap: 0.75rem; }
  #memory-search { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  #memory-search input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
  }
  #memory-add { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  #memory-add input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
  }
  .memory-entry {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.5rem;
  }
  .memory-entry .memory-body { flex: 1; min-width: 0; }
  .memory-entry .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.25rem; }
  .memory-entry .delete-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 0.15rem 0.55rem;
    cursor: pointer;
    font-size: 0.75rem;
    flex-shrink: 0;
  }
  .memory-entry .delete-btn:hover { color: var(--error); border-color: var(--error); }
  .memory-entry .delete-btn:disabled { opacity: 0.5; cursor: default; }

  /* Goals, Routines -- shared card look, same shape as .gap-entry */
  #goals-view, #routines-view { padding: 1rem; overflow-y: auto; }
  #goals-toolbar, #routines-toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  #goal-create, #routine-create { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  #goal-create input, #routine-create input {
    flex: 1;
    min-width: 8rem;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
  }
  #routine-create input#routine-interval { flex: 0 0 8rem; }
  .goal-entry, .routine-entry {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.5rem;
  }
  .goal-entry .title-row, .routine-entry .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }
  .goal-entry .title-row strong, .routine-entry .title-row strong { font-size: 0.95rem; }
  .goal-status { display: inline-block; border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.72rem; margin-left: 0.5rem; vertical-align: middle; }
  .goal-status.active { background: #3a2f14; color: #e0a83a; }
  .goal-status.completed { background: #1c3a24; color: #6fbf73; }
  .goal-status.abandoned { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .objective-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; font-size: 0.85rem; }
  .objective-row input[type=checkbox] { flex-shrink: 0; }
  .objective-row.done span { color: var(--muted); text-decoration: line-through; }
  .objective-add { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .objective-add input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
  }
  .entry-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .entry-actions button, .objective-add button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.2rem 0.6rem;
    cursor: pointer;
    font-size: 0.78rem;
  }
  .entry-actions button:disabled, .objective-add button:disabled { opacity: 0.5; cursor: default; }
  .routine-entry.disabled { color: var(--muted); }
  .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.35rem; }

  /* Protocols */
  #protocols-view { padding: 1rem; overflow-y: auto; }
  .protocol-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  .protocol-bar .action-btn { padding: 0.35rem 0.9rem; }
  .guest-toggle { font-size: 0.9rem; }
  .protocol-card { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 0.7rem 0.9rem; margin-bottom: 0.6rem; }
  .protocol-card h3 { margin: 0 0 0.2rem; font-size: 1rem; }
  .protocol-card .protocol-desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
  .protocol-card ol { margin: 0.3rem 0 0.5rem 1.2rem; padding: 0; font-size: 0.85rem; }
  .protocol-card li.skip { color: var(--muted); text-decoration: line-through; }
  .protocol-card .protocol-actions { display: flex; gap: 0.4rem; }
  .protocol-card .protocol-actions button { padding: 0.3rem 0.8rem; }

  /* Cron */
  #cron-view { padding: 1rem; overflow-y: auto; }
  #cron-view button#cron-refresh { margin-bottom: 1rem; }
  .cron-host-group { margin-bottom: 1.25rem; }
  .cron-host-group h3 { font-size: 0.9rem; margin: 0 0 0.5rem; color: var(--muted); font-weight: 600; }
  .cron-entry {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.5rem;
  }
  .cron-entry.disabled { color: var(--muted); }
  .cron-entry .cron-schedule { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; color: var(--accent); }
  .cron-entry.disabled .cron-schedule { color: var(--muted); }
  .cron-entry .cron-command { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; margin-top: 0.2rem; word-break: break-all; }
  .cron-entry button { flex-shrink: 0; }
  .cron-host-error { border-color: var(--error); color: var(--error); background: var(--panel); border-width: 1px; border-style: solid; border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; font-size: 0.85rem; }

  /* Gaps */
  #gaps-view { padding: 1rem; overflow-y: auto; }
  #gaps-toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .gap-entry { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; }
  .gap-entry .suggestion { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; white-space: pre-wrap; }
  .gap-entry .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.35rem; }
  .gap-status { display: inline-block; border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.72rem; margin-left: 0.5rem; vertical-align: middle; }
  .gap-status.open { background: #3a2f14; color: #e0a83a; }
  .gap-status.resolved { background: #1c3a24; color: #6fbf73; }
  .gap-status.pr_open { background: #16324a; color: #6fb3ef; }
  .gap-status.failed { background: #3a2222; color: var(--error); }
  .gap-status.dismissed { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .gap-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .gap-actions button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.2rem 0.6rem;
    cursor: pointer;
    font-size: 0.78rem;
  }
  .gap-actions button:disabled { opacity: 0.5; cursor: default; }

  /* Activity */
  #activity-view { padding: 1rem; overflow-y: auto; }
  #activity-view button { margin-bottom: 1rem; }
  .activity-entry {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
  }
  .activity-entry.error { border-color: var(--error); }
  .activity-entry .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .activity-entry .tool-name.error { color: var(--error); }
  .activity-entry .detail { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; white-space: pre-wrap; word-wrap: break-word; }
  .activity-entry .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.35rem; }

  /* Status */
  #status-view { padding: 1rem; overflow-y: auto; }
  #status-view button { margin-bottom: 1rem; }
  dl.status-grid { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1rem; margin: 0; }
  dl.status-grid dt { color: var(--muted); }
  dl.status-grid dd { margin: 0; }
  .tag { display: inline-block; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.6rem; margin: 0.15rem 0.3rem 0.15rem 0; font-size: 0.8rem; }

  .empty { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>Siris<span>AI</span></h1>
  <nav>
    <button data-view="chat" class="active">Chat</button>
    <button data-view="memory">Memory</button>
    <button data-view="goals">Goals</button>
    <button data-view="routines">Routines</button>
    <button data-view="protocols">Protocols</button>
    <button data-view="cron">Cron</button>
    <button data-view="gaps">Gaps</button>
    <button data-view="activity">Activity</button>
    <button data-view="status">Status</button>
  </nav>
</header>

<div id="key-bar">
  <span>API key:</span>
  <input id="key-input" type="password" placeholder="leave blank if auth is disabled" />
  <button id="key-save">Save</button>
  <span id="key-status"></span>
</div>

<div id="settings-bar">
  <label><input type="checkbox" id="auto-speak-toggle" /> Auto-play voice replies</label>
  <label><input type="checkbox" id="auto-thinking-toggle" /> Show thinking live</label>
</div>

<main>
  <section id="chat-view" class="view active">
    <div id="chat-toolbar"><select id="history-select" title="Past conversations" aria-label="Past conversations"><option value="">History</option></select><button type="button" id="new-chat-btn">New chat</button></div>
    <div id="messages"></div>
    <div id="attachments" hidden></div>
    <form id="chat-form">
      <button type="button" id="mic-btn" title="Record a voice message">&#127908;</button>
      <button type="button" id="attach-btn" title="Attach a photo">&#128206;</button>
      <input type="file" id="attach-input" accept="image/*" multiple hidden />

    </form>
  </section>

        <option value="completed">Completed</option>

      <input id="routine-actions" type="text" placeholder="Tool names, comma-separated" />
      <button class="action-btn" type="submit">Create</button>
    </form>

      <button class="action-btn" id="routines-refresh">Refresh</button>
      <button class="action-btn" id="routines-run-due">Run due now</button>
    </div>
    <div id="routines-list"></div>

  <section id="protocols-view" class="view">
    <div class="protocol-bar">
      <button class="action-btn" id="protocols-refresh">Refresh</button>
      <button class="action-btn" id="protocols-undo">Undo last protocol</button>
      <label class="guest-toggle"><input type="checkbox" id="guest-toggle" /> Guest mode</label>
      <span id="protocols-status"></span>

    <div id="protocols-list"></div>

  <section id="cron-view" class="view">
    <p class="empty" id="cron-unavailable" style="display:none;">
      No cron hosts configured (SIRISAI_CRON_HOSTS) -- see /siris/status.
    </p>
    <div id="cron-body" style="display:none;">
      <button class="action-btn" id="cron-refresh">Refresh</button>

    <div id="gaps-toolbar">

      <button class="action-btn" id="gaps-rebuild" style="display:none;">Rebuild &amp; restart SirisAI</button>

    <div id="gaps-list"></div>

    <div id="activity-list"></div>

    <div id="status-body"></div>
    <div id="voiceid" hidden>
      <h3>Voice ID</h3>
      <p class="voiceid-hint">Record three or four 5-second samples of each person talking naturally, ideally in different rooms. Satellites then recognise who is speaking.</p>
      <div class="voiceid-controls">
        <input id="voiceid-user" placeholder="Name, e.g. brad" autocomplete="off">
        <button class="action-btn" id="voiceid-record">Record sample</button>
        <button class="action-btn" id="voiceid-test">Who am I?</button>
        <span id="voiceid-status"></span>
      </div>
      <div id="voiceid-list"></div>
    </div>
  </section>
</main>

<script>
(() => {
  const KEY_STORAGE = "sirisai_api_key";
  const keyInput = document.getElementById("key-input");
  const keyStatus = document.getElementById("key-status");
  keyInput.value = localStorage.getItem(KEY_STORAGE) || "";

  document.getElementById("key-save").addEventListener("click", () => {
    localStorage.setItem(KEY_STORAGE, keyInput.value.trim());
    keyStatus.textContent = "saved";
    keyStatus.className = "ok";
    setTimeout(() => (keyStatus.textContent = ""), 1500);
  });

  async function api(path, options = {}) {
    const key = localStorage.getItem(KEY_STORAGE);
    // Skip Content-Type for FormData -- the browser sets its own multipart
    // boundary, and overriding it breaks the upload.
    const isFormData = options.body instanceof FormData;
    const headers = Object.assign({}, isFormData ? {} : { "Content-Type": "application/json" }, options.headers || {});
    if (key) headers["Authorization"] = `Bearer ${key}`;
    const response = await fetch(path, Object.assign({}, options, { headers }));
    if (response.status === 401) {
      keyStatus.textContent = "unauthorized -- check API key";
      keyStatus.className = "error";
      throw new Error("unauthorized");
    }
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.detail || `request failed (${response.status})`);
    }
    if (options.raw) return response;
    return response.status === 204 ? null : response.json();
  }

  // Shared by the Goals/Routines tabs: invoke any registered tool
  // directly via POST /siris/tools/{name}/run, the same generic endpoint
  // the Gaps tab already uses for resolve_capability_gap/dismiss_capability_gap/
  // rebuild_and_restart. `confirmed: true` is only meaningful for a
  // CONFIRM_REQUIRED tool -- a plain SAFE_ACTION
  // tool ignores it, so it's always safe to pass through.
  function runTool(name, args, confirmed) {
    return api(`/siris/tools/${name}/run`, {
      method: "POST",
      body: JSON.stringify({ arguments: args, confirmed: !!confirmed }),
    });
  }

  // Generic "do this action, then reload the tab" button, same shape as
  // the Gaps tab's own gapActionButton but reusable across Goals/Routines
  // instead of being redefined per tab.
  function actionButton(label, onClick, reload) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        await onClick();
        reload();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
    return btn;
  }

  // --- Navigation ---
  const navButtons = document.querySelectorAll("nav button");
  const views = document.querySelectorAll("section.view");
  navButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      navButtons.forEach((b) => b.classList.remove("active"));
      views.forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`${btn.dataset.view}-view`).classList.add("active");
      if (btn.dataset.view === "memory") loadMemory();
      if (btn.dataset.view === "goals") loadGoals();
      if (btn.dataset.view === "routines") loadRoutines();
      if (btn.dataset.view === "cron") loadCron();
      if (btn.dataset.view === "protocols") loadProtocols();
      if (btn.dataset.view === "gaps") loadGaps();
      if (btn.dataset.view === "activity") loadActivity();
      if (btn.dataset.view === "status") loadStatus();
    });
  });

  // --- Chat ---
  const messages = document.getElementById("messages");
  const chatForm = document.getElementById("chat-form");
  const chatInput = document.getElementById("chat-input");
  // null = no conversation yet; the server creates one on the first /siris/chat
  // call and every response echoes back the id in play, so later turns keep
  // sending it back to carry context forward.
  let conversationId = null;

  const CONV_KEY = "sirisai_conversation";
  function rememberConversation(id) {
    try { localStorage.setItem(CONV_KEY, id || ""); } catch (err) { /* storage can be unavailable */ }
  }

  const historySelect = document.getElementById("history-select");

  async function refreshHistory() {
    try {
      const list = await api("/siris/conversations?limit=20");
      historySelect.innerHTML = '<option value="">History</option>';
      for (const c of list) {
        const opt = document.createElement("option");
        opt.value = c.conversation_id;
        const when = new Date(c.last_at + "Z").toLocaleString([], { dateStyle: "short", timeStyle: "short" });
        opt.textContent = `${when} \u2014 ${c.started_with}`;
        historySelect.appendChild(opt);
      }
      if (conversationId) historySelect.value = conversationId;
    } catch (err) { /* history is a convenience; the chat works without it */ }
  }

  async function openConversation(id) {
    const history = await api(`/siris/conversations/${id}`);
    messages.innerHTML = "";
    for (const m of history) {
      if (!m.content) continue;
      if (m.role === "user") {
        const hadImage = /\[\[image: [\s\S]*?\]\]/.test(m.content);
        addMessage(m.content.replace(/\s*\[\[image: [\s\S]*?\]\]/g, "").trim() + (hadImage ? " \u{1F4CE}" : ""), "user");
      }
      else if (m.role === "assistant") addMessage(m.content, "assistant");
    }
    conversationId = id;
    rememberConversation(id);
  }

  historySelect.addEventListener("change", async () => {
    if (!historySelect.value) return;
    try { await openConversation(historySelect.value); } catch (err) { addMessage(err.message, "error"); }
  });

  document.getElementById("new-chat-btn").addEventListener("click", () => {
    conversationId = null;
    rememberConversation("");
    historySelect.value = "";
    messages.innerHTML = "";
    chatInput.focus();
  });

  // Minimal, safe markdown for assistant replies. Everything is built with
  // DOM nodes and textContent (never innerHTML), and links must be http(s).
  function mdInline(parent, text) {
    const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\[[^\]\n]+\]\((https?:\/\/[^\s)]+)\))|(\*[^*\s][^*\n]*\*)/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1]) {
        const c = document.createElement("code"); c.textContent = m[1].slice(1, -1); parent.appendChild(c);
      } else if (m[2]) {
        const b = document.createElement("strong"); mdInline(b, m[2].slice(2, -2)); parent.appendChild(b);
      } else if (m[3]) {
        const a = document.createElement("a");
        a.href = m[4]; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = m[3].slice(1, m[3].indexOf("]"));
        parent.appendChild(a);
      } else if (m[5]) {
        const em = document.createElement("em"); em.textContent = m[5].slice(1, -1); parent.appendChild(em);
      }
      last = re.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function renderMarkdown(container, text) {
    container.textContent = "";
    container.classList.add("md");
    const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
    let para = [];
    let list = null;
    const flushPara = () => {
      if (!para.length) return;
      const p = document.createElement("p"); mdInline(p, para.join("\n")); container.appendChild(p); para = [];
    };
    const flushList = () => { list = null; };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const fence = line.match(/^\s*```\s*([\w+-]*)\s*$/);
      if (fence) {
        flushPara(); flushList();
        const code = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        const pre = document.createElement("pre"); const c = document.createElement("code");
        c.textContent = code.join("\n"); pre.appendChild(c); container.appendChild(pre);
        continue;
      }
      const item = line.match(/^\s*([-*\u2022]|\d+[.)])\s+(.*)$/);
      if (item) {
        flushPara();
        const ordered = /\d/.test(item[1]);
        if (!list || list.ordered !== ordered) {
          const el = document.createElement(ordered ? "ol" : "ul"); container.appendChild(el); list = { el, ordered };
        }
        const li = document.createElement("li"); mdInline(li, item[2]); list.el.appendChild(li);
        continue;
      }
      const heading = line.match(/^(#{1,4})\s+(.*)$/);
      if (heading) {
        flushPara(); flushList();
        const h = document.createElement("h" + Math.min(heading[1].length + 1, 4)); mdInline(h, heading[2]); container.appendChild(h);
        continue;
      }
      const quote = line.match(/^>\s?(.*)$/);
      if (quote) {
        flushPara(); flushList();
        let bq = container.lastElementChild;
        if (!bq || bq.tagName !== "BLOCKQUOTE") { bq = document.createElement("blockquote"); container.appendChild(bq); }
        if (bq.textContent) bq.appendChild(document.createElement("br"));
        mdInline(bq, quote[1]);
        continue;
      }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushList(); container.appendChild(document.createElement("hr")); continue; }
      if (!line.trim()) { flushPara(); flushList(); continue; }
      flushList();
      para.push(line);
    }
    flushPara();
  }

  // What a voice should read: the text without markdown punctuation.
  function plainText(text) {
    return String(text || "")
      .replace(/```[\w+-]*\n?/g, "")
      .replace(/\[([^\]]+)\]\(https?:[^)]+\)/g, "$1")
      .replace(/[*`#>]+/g, "")
      .replace(/^\s*[-\u2022]\s+/gm, "");
  }

  let ttsEnabled = true;
  let autoSpeakEnabled = false;
  let autoShowThinking = true;

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    const span = document.createElement(cls === "assistant" ? "div" : "span");
    if (cls === "assistant") renderMarkdown(span, text); else span.textContent = text;
    div.appendChild(span);
    if (cls === "assistant") attachSpeakButton(div, text);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function attachSpeakButton(div, text) {
    if (!ttsEnabled) return;
    const speakBtn = document.createElement("button");
    speakBtn.type = "button";
    speakBtn.className = "speak-btn";
    speakBtn.title = "Play";
    speakBtn.textContent = "\u{1f50a}";
    speakBtn.addEventListener("click", () => speak(plainText(text), speakBtn));
    div.appendChild(speakBtn);
  }

  // One chat turn, streamed (POST /siris/chat/stream or /siris/chat/confirm/stream,
  // Server-Sent Events): shows a live bubble with what SirisAI is doing right now
  // -- current stage, its reasoning as it thinks, each tool it runs -- and the
  // answer as it's written, instead of nothing until the whole reply is ready.
  // Resolves with the final ChatResponse (same shape as the non-streaming
  // endpoints); rejects with an Error carrying the server's message.
  async function runChatTurn(path, body, signal) {
    const div = document.createElement("div");
    div.className = "msg assistant live";

    const status = document.createElement("div");
    status.className = "live-status";
    const spinner = document.createElement("span");
    spinner.className = "live-spinner";
    const statusText = document.createElement("span");
    status.append(spinner, statusText);

    const thinking = document.createElement("details");
    thinking.className = "thinking";
    thinking.hidden = true;
    thinking.open = autoShowThinking;
    const thinkingSummary = document.createElement("summary");
    const thinkingText = document.createElement("div");
    thinkingText.className = "thinking-text";
    thinking.append(thinkingSummary, thinkingText);

    const steps = document.createElement("div");
    steps.className = "tool-steps";
    const answer = document.createElement("div");
    div.append(status, thinking, steps, answer);
    messages.appendChild(div);

    const started = Date.now();
    let stage = "Thinking";
    // Reasoning can happen twice in a turn (deciding what to do, then
    // writing the answer after a tool ran) -- total time is accumulated
    // across phases, and each new phase re-opens the panel.
    let thinkingMs = 0;
    let thinkingSince = null;
    let answerText = "";
    let finalResponse = null;
    let failure = null;
    const stepEls = new Map();

    const scroll = () => { messages.scrollTop = messages.scrollHeight; };
    const elapsed = () => Math.round((Date.now() - started) / 1000);
    const renderStatus = () => {
      statusText.textContent = `${stage}\u2026 ${elapsed()}s`;
      if (thinkingSince !== null) {
        thinkingSummary.textContent = `Thinking\u2026 ${Math.round((thinkingMs + Date.now() - thinkingSince) / 1000)}s`;
      }
    };
    const startThinking = () => {
      if (thinkingSince !== null) return;
      thinkingSince = Date.now();
      if (thinkingText.textContent) thinkingText.textContent += "\n\n";
      thinking.hidden = false;
      thinking.open = autoShowThinking;
    };
    const endThinking = () => {
      if (thinkingSince === null) return;
      thinkingMs += Date.now() - thinkingSince;
      thinkingSince = null;
      thinkingSummary.textContent = `Thought for ${Math.max(1, Math.round(thinkingMs / 1000))}s`;
      thinking.open = false;
    };
    renderStatus();
    const timer = setInterval(renderStatus, 1000);

    const handle = (event) => {
      if (event.type === "status") {
        stage = event.message;
      } else if (event.type === "thinking") {
        stage = "Thinking";
        startThinking();
        thinkingText.textContent += event.delta;
        thinkingText.scrollTop = thinkingText.scrollHeight;
      } else if (event.type === "content") {
        endThinking();
        stage = "Writing answer";
        answerText += event.delta;
        renderMarkdown(answer, answerText);
      } else if (event.type === "tool_start") {
        // Any text streamed so far was provisional -- the model chose a
        // tool instead, and the real answer is written after it runs.
        answerText = "";
        answer.textContent = "";
        endThinking();
        stage = `Running ${event.name}`;
        const el = document.createElement("div");
        el.className = "tool-step";
        el.title = JSON.stringify(event.arguments);
        el.textContent = `\u{1f527} ${event.name}\u2026`;
        steps.appendChild(el);
        stepEls.set(event.name, el);
      } else if (event.type === "tool_end") {
        const el = stepEls.get(event.name);
        if (el) {
          const marks = { ok: "\u2713", error: "\u2717", needs_confirmation: "\u26a0\ufe0f" };
          const notes = { needs_confirmation: " (needs your confirmation)", error: " (failed)" };
          el.textContent = `${marks[event.status] || ""} ${event.name}${notes[event.status] || ""}`;
          if (event.status === "error") el.classList.add("error");
        }
        stage = "Thinking";
      } else if (event.type === "final") {
        finalResponse = event.response;
      } else if (event.type === "error") {
        failure = new Error(event.detail || "request failed");
      }
      renderStatus();
      scroll();
    };

    try {
      const response = await api(path, { method: "POST", body: JSON.stringify(body), raw: true, signal });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          for (const line of block.split("\n")) {
            if (line.startsWith("data: ")) handle(JSON.parse(line.slice(6)));
          }
        }
        // The answer (or error) is already in -- don't wait for the
        // server to finish background work (memory extraction) before
        // handing control back.
        if (finalResponse || failure) {
          reader.cancel().catch(() => {});
          break;
        }
      }
    } catch (err) {
      failure = failure || (err && err.name === "AbortError" ? Object.assign(new Error("Stopped."), { aborted: true }) : err);
    } finally {
      clearInterval(timer);
    }

    status.remove();
    endThinking();
    if (failure || !finalResponse) {
      if (!thinkingText.textContent && !steps.children.length && !answerText) div.remove();
      else div.classList.remove("live");
      throw failure || new Error("The connection closed before SirisAI finished.");
    }

    if (finalResponse.confirmation_required) {
      if (!thinkingText.textContent && !steps.children.length) div.remove();
      answer.remove();
    } else {
      const text = finalResponse.response || "Done.";
      renderMarkdown(answer, text);
      attachSpeakButton(div, text);
      if (autoSpeakEnabled && ttsEnabled) speak(plainText(text));
    }
    div.classList.remove("live");
    scroll();
    return finalResponse;
  }

  function addConfirmationPrompt(name, args, usePlanner) {
    const div = document.createElement("div");
    div.className = "msg confirm";

    const text = document.createElement("div");
    text.textContent = `⚠️ Confirm: ${name}(${JSON.stringify(args)})`;
    div.appendChild(text);

    const actions = document.createElement("div");
    actions.className = "confirm-actions";

    const yesBtn = document.createElement("button");
    yesBtn.type = "button";
    yesBtn.className = "confirm-yes";
    yesBtn.textContent = "Confirm";
    const noBtn = document.createElement("button");
    noBtn.type = "button";
    noBtn.className = "confirm-no";
    noBtn.textContent = "Cancel";

    yesBtn.addEventListener("click", async () => {
      yesBtn.disabled = true;
      noBtn.disabled = true;
      try {
        div.remove();
        // Only the model's plain-English answer is shown -- the raw tool
        // call/result is still in GET /siris/activity for anyone who
        // wants it, just not surfaced in the chat itself. Synthesis
        // should basically always produce text once a tool actually ran
        // (a completed action, not just a lookup), so "Done." is a rare
        // fallback, not the common case.
        await runChatTurn("/siris/chat/confirm/stream", {
          conversation_id: conversationId,
          tool_name: name,
          arguments: args,
          use_planner: !!usePlanner,
        });
      } catch (err) {
        addMessage(err.message, "error");
      }
    });
    noBtn.addEventListener("click", () => {
      div.remove();
      addMessage(`Cancelled: ${name}`, "tool");
    });

    actions.appendChild(yesBtn);
    actions.appendChild(noBtn);
    div.appendChild(actions);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function speak(text, btn) {
    if (btn) btn.disabled = true;
    try {
      const response = await api("/siris/voice/speak", {
        method: "POST",
        body: JSON.stringify({ text }),
        raw: true,
      });
      const blob = await response.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      await audio.play();
    } catch (err) {
      // Autoplay can be blocked by the browser until the user has
      // interacted with the page at all -- not worth an error bubble for
      // the automatic case, the speaker button is still right there.
      if (btn) addMessage(err.message, "error");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // --- Voice input (mic -> transcribe -> fill chat input for review) ---
  const micBtn = document.getElementById("mic-btn");
  let mediaRecorder = null;
  let recordedChunks = [];

  micBtn.addEventListener("click", async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      addMessage(`Microphone unavailable: ${err.message}`, "error");
      return;
    }

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.addEventListener("dataavailable", (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    });
    mediaRecorder.addEventListener("stop", async () => {
      stream.getTracks().forEach((track) => track.stop());
      micBtn.classList.remove("recording");

      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const formData = new FormData();
      formData.append("file", blob, "recording.webm");
      const originalPlaceholder = chatInput.placeholder;
      chatInput.placeholder = "Transcribing...";
      micBtn.disabled = true;
      try {
        const result = await api("/siris/voice/transcribe", { method: "POST", body: formData });
        chatInput.value = result.text;

  // --- Photo attachments: resized in the browser (max 1280px JPEG) and sent
  // as base64 with the next message; SIRISAI_VISION_MODEL looks at them.
  const attachBtn = document.getElementById("attach-btn");
  const attachInput = document.getElementById("attach-input");
  const attachmentsBox = document.getElementById("attachments");
  let pendingImages = [];

  function renderAttachments() {
    attachmentsBox.innerHTML = "";
    attachmentsBox.hidden = pendingImages.length === 0;
    pendingImages.forEach((dataUrl, index) => {
      const wrap = document.createElement("div");
      wrap.className = "attachment";
      const img = document.createElement("img");
      img.src = dataUrl;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "x";
      remove.title = "Remove";
      remove.addEventListener("click", () => { pendingImages.splice(index, 1); renderAttachments(); });
      wrap.appendChild(img);
      wrap.appendChild(remove);
      attachmentsBox.appendChild(wrap);
    });
  }

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Couldn't read that image."));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("That file isn't an image the browser can read."));
        img.onload = () => {
          const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function addImageFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith("image/") || pendingImages.length >= 4) continue;
      try { pendingImages.push(await resizeImage(file)); } catch (err) { addMessage(err.message, "error"); }
    }
    renderAttachments();
  }

  attachBtn.addEventListener("click", () => attachInput.click());
  attachInput.addEventListener("change", () => { addImageFiles([...attachInput.files]); attachInput.value = ""; });
  chatInput.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); addImageFiles(files); }
  });

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (running) return;
    const images = pendingImages;
    const prompt = chatInput.value.trim() || (images.length ? "What's in this picture?" : "");
    if (!prompt) return;
    const userBubble = addMessage(prompt, "user");
    for (const src of images) {
      const img = document.createElement("img");
      img.className = "attached";
      img.src = src;
      if (userBubble) userBubble.appendChild(img);
    }
    pendingImages = [];
    renderAttachments();
    chatInput.value = "";
    running = new AbortController();
    chatSendBtn.textContent = "Stop";
    chatSendBtn.classList.add("stop");
    try {
      // Only the model's plain-English answer is shown, never the raw
      // tool call/result -- that's still in GET /siris/activity for
      // anyone who wants it. "Done." is a rare fallback for the case
      // synthesis didn't produce text at all (see runChatTurn).
      const body = { prompt, conversation_id: conversationId };
      if (images.length) body.images = images;
      const result = await runChatTurn("/siris/chat/stream", body, running.signal);
      conversationId = result.conversation_id;
      rememberConversation(conversationId);
      if (result.confirmation_required) {
        addConfirmationPrompt(result.confirmation_required.name, result.confirmation_required.arguments, result.used_planner);
      }
    } catch (err) {
      if (err && err.aborted) addMessage("Stopped. SirisAI may still finish anything it had already started.", "tool");
      else addMessage(err.message, "error");
    } finally {
      running = null;
      chatSendBtn.textContent = "Send";
      chatSendBtn.classList.remove("stop");
      chatInput.focus();
      refreshHistory();

  const cronList = document.getElementById("cron-list");

  function renderCron(jobs) {
    cronList.innerHTML = "";
    if (!jobs.length) {
      cronList.innerHTML = '<p class="empty">No cron jobs found.</p>';
      return;
    }
    const jobsByHost = new Map();
    for (const job of jobs) {
      if (!jobsByHost.has(job.host)) jobsByHost.set(job.host, []);
      jobsByHost.get(job.host).push(job);
    }
    for (const [host, hostJobs] of jobsByHost) {
      const group = document.createElement("div");
      group.className = "cron-host-group";
      const heading = document.createElement("h3");
      heading.textContent = host;
      group.appendChild(heading);

      const errorJob = hostJobs.find((j) => j.error);
      if (errorJob) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "cron-host-error";
        errorDiv.textContent = errorJob.error;
        group.appendChild(errorDiv);
        cronList.appendChild(group);
        continue;
      }

      for (const job of hostJobs) {
        const div = document.createElement("div");
        div.className = job.enabled ? "cron-entry" : "cron-entry disabled";

        const body = document.createElement("div");
        const schedule = document.createElement("div");
        schedule.className = "cron-schedule";
        schedule.textContent = job.schedule;
        const command = document.createElement("div");
        command.className = "cron-command";
        command.textContent = job.command;
        body.appendChild(schedule);
        body.appendChild(command);
        div.appendChild(body);

        const actions = document.createElement("div");
        actions.className = "entry-actions";
        const toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.textContent = job.enabled ? "Disable" : "Enable";
        toggleBtn.addEventListener("click", async () => {
          toggleBtn.disabled = true;
          try {
            await runTool("cron_set_job_enabled", { host: job.host, line: job.line, enabled: !job.enabled }, true);
            loadCron();
          } catch (err) {
            alert(err.message);
            toggleBtn.disabled = false;
          }
        });
        actions.appendChild(toggleBtn);
        div.appendChild(actions);

        group.appendChild(div);
      }
      cronList.appendChild(group);
    }
  }

  async function loadGaps() {
    gapsList.innerHTML = '<p class="empty">Loading...</p>';
    try {
      const [entries, status] = await Promise.all([
        api("/siris/capability_gaps?limit=100"),
        api("/siris/status"),
      ]);
      const canResolve = status.tools.includes("resolve_capability_gap");
      const canDismiss = status.tools.includes("dismiss_capability_gap");
      const canRebuild = status.tools.includes("rebuild_and_restart");

      gapsRebuildBtn.style.display = canRebuild ? "" : "none";
      if (canRebuild && !gapsRebuildWired) {
        gapsRebuildWired = true;
        gapsRebuildBtn.addEventListener("click", async () => {
          if (!confirm("Rebuild and restart SirisAI now? It will be briefly unavailable.")) return;
          gapsRebuildBtn.disabled = true;
          try {
            await api("/siris/tools/rebuild_and_restart/run", {
              method: "POST",
              body: JSON.stringify({ arguments: {}, confirmed: true }),
            });
          } catch (err) {
            alert(err.message);
          } finally {
            gapsRebuildBtn.disabled = false;
          }
        });
      }

      gapsList.innerHTML = "";
      if (!entries.length) {
        gapsList.innerHTML = '<p class="empty">No gaps reported yet.</p>';
        return;
      }
      for (const entry of entries) {
        const div = document.createElement("div");
        div.className = "gap-entry";

        const heading = document.createElement("div");
        heading.textContent = entry.requested_capability;
        heading.appendChild(gapStatusBadge(entry.status));
        div.appendChild(heading);

        if (entry.suggested_integration) {
          const suggestion = document.createElement("div");
          suggestion.className = "suggestion";
          suggestion.textContent = `Suggested: ${entry.suggested_integration}`;
          div.appendChild(suggestion);
        }

        if (entry.resolution_detail) {
          const detail = document.createElement("div");
          detail.className = "suggestion";
          detail.textContent = entry.resolution_detail;
          div.appendChild(detail);
        }

        if (entry.status === "open" && (canResolve || canDismiss)) {
          const actions = document.createElement("div");
          actions.className = "gap-actions";
          if (canResolve) {
            actions.appendChild(
              gapActionButton("Attempt fix", () => {
                if (!confirm("Let Hermes draft, test and merge a code change to main for this gap?")) return null;
                return api("/siris/tools/resolve_capability_gap/run", {
                  method: "POST",
                  body: JSON.stringify({ arguments: { gap_id: entry.id }, confirmed: true }),
                });
              })
            );
          }
          if (canDismiss) {
            actions.appendChild(
              gapActionButton("Dismiss", () =>
                api("/siris/tools/dismiss_capability_gap/run", {
                  method: "POST",
                  body: JSON.stringify({ arguments: { gap_id: entry.id } }),
                })
              )
            );
          }
          div.appendChild(actions);
        }

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `#${entry.id} · ${new Date(entry.created_at).toLocaleString()}`;
        div.appendChild(meta);

        gapsList.appendChild(div);
      }
    } catch (err) {
      gapsList.innerHTML = `<p class="empty">${err.message}</p>`;
    }

  // --- Status ---
  const statusBody = document.getElementById("status-body");

  async function loadStatus() {
    statusBody.innerHTML = '<p class="empty">Loading...</p>';
    try {
      const status = await api("/siris/status");
      const dl = document.createElement("dl");
      dl.className = "status-grid";
      const rows = [
        ["App", status.app_name],
        ["Environment", status.environment],
        ["LLM provider", status.llm_provider],
        ["STT provider", status.stt_provider],
        ["TTS provider", status.tts_provider],
      ];
      for (const [label, value] of rows) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        dl.appendChild(dt);
        dl.appendChild(dd);
      }
      const dt = document.createElement("dt");
      dt.textContent = "Tools";
      const dd = document.createElement("dd");
      dd.innerHTML = "";
      for (const tool of status.tools) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = tool;
        dd.appendChild(span);
      }
      dl.appendChild(dt);
      dl.appendChild(dd);

      // Whether each configured service is reachable right now, and which
      // tools are paused because they keep failing.
      try {
        const health = await api("/siris/integrations/health");
        const hdt = document.createElement("dt");
        hdt.textContent = "Integrations";
        const hdd = document.createElement("dd");
        for (const c of health.integrations) {
          const span = document.createElement("span");
          span.className = c.ok ? "tag" : "tag bad";
          span.textContent = c.ok ? c.name : `${c.name}: down`;
          span.title = c.detail;
          hdd.appendChild(span);
        }
        for (const [name, note] of Object.entries(health.notes || {})) {
          const span = document.createElement("span");
          span.className = "tag bad";
          span.textContent = `${name}: ${note}`;
          hdd.appendChild(span);
        }
        dl.appendChild(hdt);
        dl.appendChild(hdd);
        if (health.paused_tools.length) {
          const pdt = document.createElement("dt");
          pdt.textContent = "Paused tools";
          const pdd = document.createElement("dd");
          for (const name of health.paused_tools) {
            const span = document.createElement("span");
            span.className = "tag bad";
            span.textContent = name;
            pdd.appendChild(span);
          }
          dl.appendChild(pdt);
          dl.appendChild(pdd);
        }
      } catch (err) { /* health is extra; the rest of the status still shows */ }

      statusBody.innerHTML = "";
      statusBody.appendChild(dl);
      voiceIdBox.hidden = !status.speaker_recognition;
      if (status.speaker_recognition) loadVoiceprints();
    } catch (err) {
      statusBody.innerHTML = `<p class="empty">${err.message}</p>`;
    }
  }

  document.getElementById("status-refresh").addEventListener("click", loadStatus);

  // --- Protocols: named playbooks (lockdown, away, guest...). "Run" first
  // previews every step (dry run) and then asks for the one confirmation.
  const protocolsList = document.getElementById("protocols-list");
  const protocolsStatus = document.getElementById("protocols-status");
  const guestToggle = document.getElementById("guest-toggle");

  async function toolResult(name, args, options = {}) {
    const response = await api(`/siris/tools/${name}/run`, {
      method: "POST",
      body: JSON.stringify(Object.assign({ arguments: args || {} }, options)),
    });
    return response.tool_call ? response.tool_call.result : null;
  }

  function describeSteps(steps) {
    return steps.map((s) => `${s.will_run ? "- " : "- (skipped) "}${s.step}${s.will_run ? "" : ` -- ${s.because}`}`).join("\n");
  }

  async function loadProtocols() {
    protocolsList.innerHTML = '<p class="empty">Loading...</p>';
    try {
      const [protocols, guestState] = await Promise.all([toolResult("list_protocols"), toolResult("guest_mode_status")]);
      guestToggle.checked = !!(guestState && guestState.on);
      protocolsList.innerHTML = protocols.length ? "" : '<p class="empty">No protocols available.</p>';
      for (const proto of protocols) {
        const card = document.createElement("div");
        card.className = "protocol-card";
        const title = document.createElement("h3");
        title.textContent = proto.name.replace(/_/g, " ") + (proto.builtin ? "" : " (custom)");
        const desc = document.createElement("div");
        desc.className = "protocol-desc";
        desc.textContent = proto.description || "";
        const list = document.createElement("ol");
        for (const step of proto.steps) {
          const li = document.createElement("li");
          li.textContent = step;
          list.appendChild(li);
        }
        const actions = document.createElement("div");
        actions.className = "protocol-actions";
        const run = document.createElement("button");
        run.className = "action-btn";
        run.textContent = "Run";
        run.addEventListener("click", async () => {
          run.disabled = true;
          try {
            const preview = await toolResult("run_protocol", { name: proto.name }, { dry_run: true });
            if (!confirm(`Run the ${proto.name.replace(/_/g, " ")} protocol?\n\n${describeSteps(preview.steps)}`)) return;
            const result = await toolResult("run_protocol", { name: proto.name }, { confirmed: true });
            const ok = result.steps.filter((s) => s.status === "ok").length;
            const failed = result.steps.filter((s) => s.status === "error").map((s) => s.step);
            protocolsStatus.textContent = `${proto.name}: ${ok} step${ok === 1 ? "" : "s"} done` + (failed.length ? `, failed: ${failed.join(", ")}` : "") + (result.undo_available ? " -- undo available" : "");
            loadProtocols();
          } catch (err) {
            protocolsStatus.textContent = err.message;
          } finally {
            run.disabled = false;
          }
        });
        actions.appendChild(run);
        if (!proto.builtin) {
          const del = document.createElement("button");
          del.className = "action-btn";
          del.textContent = "Delete";
          del.addEventListener("click", async () => {
            if (!confirm(`Delete the ${proto.name} protocol?`)) return;
            await toolResult("delete_protocol", { name: proto.name });
            loadProtocols();
          });
          actions.appendChild(del);
        }
        card.appendChild(title);
        card.appendChild(desc);
        card.appendChild(list);
        card.appendChild(actions);
        protocolsList.appendChild(card);
      }
    } catch (err) {
      protocolsList.innerHTML = `<p class="empty">${err.message}</p>`;
    }
  }

  document.getElementById("protocols-refresh").addEventListener("click", loadProtocols);
  document.getElementById("protocols-undo").addEventListener("click", async () => {
    try {
      const preview = await toolResult("undo_last_protocol", {}, { dry_run: true });
      if (!preview.protocol || preview.undone || !preview.would_run.length) { protocolsStatus.textContent = "Nothing to undo."; return; }
      if (!confirm(`Undo the ${preview.protocol} protocol? (${preview.would_run.length} change${preview.would_run.length === 1 ? "" : "s"} to put back)`)) return;
      const result = await toolResult("undo_last_protocol", {}, { confirmed: true });
      protocolsStatus.textContent = result.undone ? `Undid ${result.protocol}.` : result.reason;
      loadProtocols();
    } catch (err) {
      protocolsStatus.textContent = err.message;
    }
  });
  guestToggle.addEventListener("change", async () => {
    try {
      await toolResult("set_guest_mode", { on: guestToggle.checked });
      protocolsStatus.textContent = guestToggle.checked ? "Guest mode on -- personal info stays private." : "Guest mode off.";
    } catch (err) {
      protocolsStatus.textContent = err.message;
      guestToggle.checked = !guestToggle.checked;
    }
  });

  // --- Voice ID: record WAV in the browser (the server decodes WAV natively),
  // enrol samples, and check who a recording sounds like.
  const voiceIdBox = document.getElementById("voiceid");
  const voiceIdStatus = document.getElementById("voiceid-status");
  const voiceIdList = document.getElementById("voiceid-list");

  async function recordWav(seconds) {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    processor.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    source.connect(processor);
    processor.connect(ctx.destination);
    await new Promise((resolve) => setTimeout(resolve, seconds * 1000));
    processor.disconnect();
    source.disconnect();
    stream.getTracks().forEach((t) => t.stop());
    const rate = ctx.sampleRate;
    await ctx.close();
    const length = chunks.reduce((n, c) => n + c.length, 0);
    const view = new DataView(new ArrayBuffer(44 + length * 2));
    const writeStr = (offset, s) => { for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i)); };
    writeStr(0, "RIFF"); view.setUint32(4, 36 + length * 2, true); writeStr(8, "WAVE");
    writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    writeStr(36, "data"); view.setUint32(40, length * 2, true);
    let offset = 44;
    for (const chunk of chunks) {
      for (const sample of chunk) {
        view.setInt16(offset, Math.max(-1, Math.min(1, sample)) * 0x7fff, true);
        offset += 2;
      }
    }
    return new Blob([view], { type: "audio/wav" });
  }

  async function loadVoiceprints() {
    try {
      const prints = await api("/siris/voice/voiceprints");
      voiceIdList.innerHTML = prints.length ? "" : '<p class="empty">Nobody enrolled yet.</p>';
      for (const p of prints) {
        const row = document.createElement("div");
        row.className = "voiceid-entry";
        const label = document.createElement("span");
        label.textContent = `${p.user_id} -- ${p.samples} sample${p.samples === 1 ? "" : "s"}`;
        const remove = document.createElement("button");
        remove.className = "action-btn";
        remove.textContent = "Forget";
        remove.addEventListener("click", async () => {
          await api(`/siris/voice/voiceprints/${encodeURIComponent(p.user_id)}`, { method: "DELETE" });
          loadVoiceprints();
        });
        row.appendChild(label);
        row.appendChild(remove);
        voiceIdList.appendChild(row);
      }
    } catch (err) {
      voiceIdList.innerHTML = `<p class="empty">${err.message}</p>`;
    }
  }

  async function withRecording(label, send) {
    const buttons = [document.getElementById("voiceid-record"), document.getElementById("voiceid-test")];
    buttons.forEach((b) => (b.disabled = true));
    try {
      voiceIdStatus.textContent = `${label} -- speak now...`;
      const wav = await recordWav(5);
      voiceIdStatus.textContent = "Processing...";
      const form = new FormData();
      form.append("file", wav, "sample.wav");
      voiceIdStatus.textContent = await send(form);
    } catch (err) {
      voiceIdStatus.textContent = err.message;
    } finally {
      buttons.forEach((b) => (b.disabled = false));
    }
  }

  document.getElementById("voiceid-record").addEventListener("click", () => {
    const user = document.getElementById("voiceid-user").value.trim();
    if (!user) { voiceIdStatus.textContent = "Enter a name first."; return; }
    withRecording("Recording", async (form) => {
      form.append("user", user);
      const result = await api("/siris/voice/voiceprints/enroll", { method: "POST", body: form });
      loadVoiceprints();
      return `Saved -- ${result.user_id} now has ${result.samples} sample${result.samples === 1 ? "" : "s"}.`;
    });
  });

  document.getElementById("voiceid-test").addEventListener("click", () => {
    withRecording("Listening", async (form) => {
      const result = await api("/siris/voice/identify", { method: "POST", body: form });
      const scores = Object.entries(result.scores).map(([u, s]) => `${u} ${s.toFixed(2)}`).join(", ");
      return result.user_id ? `You sound like ${result.user_id} (${scores}).` : `Not sure who that is (${scores || "nobody enrolled"}).`;
    });
  });

  // --- Per-viewer preferences (this browser only, not synced anywhere) ---
  const AUTO_SPEAK_KEY = "sirisai_auto_speak";
  const AUTO_THINKING_KEY = "sirisai_auto_thinking";
  const autoSpeakToggle = document.getElementById("auto-speak-toggle");
  const autoThinkingToggle = document.getElementById("auto-thinking-toggle");
  try {
    autoSpeakEnabled = localStorage.getItem(AUTO_SPEAK_KEY) === "1";
    autoShowThinking = localStorage.getItem(AUTO_THINKING_KEY) !== "0"; // default on, matches prior behavior
  } catch (err) { /* storage can be unavailable; defaults above still apply */ }
  autoSpeakToggle.checked = autoSpeakEnabled;
  autoThinkingToggle.checked = autoShowThinking;
  autoSpeakToggle.addEventListener("change", () => {
    autoSpeakEnabled = autoSpeakToggle.checked;
    try { localStorage.setItem(AUTO_SPEAK_KEY, autoSpeakEnabled ? "1" : "0"); } catch (err) { /* ignore */ }
  });
  autoThinkingToggle.addEventListener("change", () => {
    autoShowThinking = autoThinkingToggle.checked;
    try { localStorage.setItem(AUTO_THINKING_KEY, autoShowThinking ? "1" : "0"); } catch (err) { /* ignore */ }
  });

  // Startup: hide voice controls that can't work, reopen the last conversation,
  // fill the history list.
  (async () => {
    try {
      const status = await api("/siris/status");
      if (status.stt_provider === "none") micBtn.hidden = true;
      ttsEnabled = status.tts_provider !== "none";
    } catch (err) { /* not signed in yet; the controls stay */ }
    let saved = "";
    try { saved = localStorage.getItem(CONV_KEY) || ""; } catch (err) { /* ignore */ }
    if (saved) {
      try { await openConversation(saved); } catch (err) { rememberConversation(""); }
    }
    refreshHistory();
  })();

  chatInput.focus();
})();
</script>
</body>
</html>
