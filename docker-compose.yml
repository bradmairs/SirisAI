services:
  sirisai:
    build: .
    image: sirisai:local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # SSH identity + known_hosts for the cron overview (SIRISAI_CRON_HOSTS):
      # kept under ./data so it survives rebuilds. Generate a dedicated key
      # here (ssh-keygen -t ed25519 -N "" -f data/ssh/id_ed25519) and add
      # the .pub to each cron host's authorized_keys -- see .env.example.
      - ./data/ssh:/root/.ssh
      # Uncomment to enable the docker_* tools (see README) -- gives this
      # container full control over the host's Docker. Only do this if
      # you're comfortable with that; it's the whole reason
      # docker_restart_container is SAFE_ACTION rather than READ.
      # - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      SIRISAI_DATABASE_URL: sqlite:///./data/sirisai.db
    restart: unless-stopped

  # Optional: makes the Obsidian Local REST API reachable from this container.
  # The plugin only listens on 127.0.0.1 inside its own container, so this
  # sidecar shares that container's network namespace and republishes the port
  # on all interfaces (Obsidian's container must publish 27123). Replaces the
  # hand-made socat relay, which disappeared whenever Obsidian's container was
  # recreated. Enable with:  docker compose --profile obsidian-relay up -d
  # If the Obsidian container is ever recreated, recreate this one too:
  #   docker compose --profile obsidian-relay up -d --force-recreate obsidian-relay
  obsidian-relay:
    profiles: ["obsidian-relay"]
    image: alpine/socat
    network_mode: "container:obsidian"
    command: TCP-LISTEN:27123,fork,reuseaddr TCP:127.0.0.1:27124
    restart: unless-stopped
